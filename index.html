<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ededef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Carnet sport</title>
</head>
<body>
<main id="app"></main>

<div id="dock">
  <div class="dbrand">Carnet <b>sport</b></div>
  <button id="live" hidden aria-label="Revenir à la séance">
    <span class="lv-dot"></span>
    <span class="lv-total" data-clock="total">0:00</span>
    <span class="lv-rest" id="lvRest"></span>
    <span class="lv-stop" id="lvStop" role="button" tabindex="0" hidden>Stop</span>
  </button>
  <nav id="nav">
    <button data-view="home">Accueil</button>
    <button data-view="program">Séances</button>
    <button data-view="progress" class="navj"><span class="nj-ic" aria-hidden="true">Journal</span><span class="nj-t">Journal</span></button>
    <button data-view="social" class="desk">Amis</button>
    <button data-view="ana" class="desk">Analyses</button>
    <button data-view="lib" class="desk">Exercices</button>
    <button data-view="progs" class="desk">Programmes</button>
    <button data-view="tools">Outils</button>
    <button data-view="me">Moi</button>
  </nav>
</div>

<div id="sheet" hidden><div class="sheet-bg" data-close></div><div class="sheet-card" role="dialog" aria-modal="true"><div id="sheetBody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="library.js"></script>
<script src="body.js"></script>
<script src="plan.js"></script>
<script src="models.js"></script>
<script src="journal.js"></script>
<script src="tools.js"></script>
<script src="chrono.js"></script>
<script src="nutri.js"></script>
<script src="me.js"></script>
<script src="extras.js"></script>
<script src="fileimport.js"></script>
<script src="act.js"></script>
<script src="desk.js"></script>
<script src="sync.js"></script>
<script src="push.js"></script>
<script src="auth.js"></script>
<script src="social.js"></script>
<script src="gen.js"></script>
<script src="app.js"></script>
</body>
</html>
